<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>VeriPay cover</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* The submission cover and the film's first shot, in the app's own tokens (web/src/theme.css, DESIGN.md): white-led,
     near-navy ink, PayPal-family blues, yellow only on the PAID stamp. Our own mark, not PayPal's. Kept to the mark, the
     headline, one line, the event, and one product visual (the pro's phone at the paid job, sandbox run). */
  :root {
    --ground: #F5F7FA; --line: #DCE3EC; --line-strong: #B7C3D3;
    --ink: #001C64; --ink-2: #2E3F66; --ink-3: #56657F;
    --primary: #003087; --signal: #0070E0;
    --paid: #FFD140; --paid-ink: #3D2E00;
    --display: "Plus Jakarta Sans", sans-serif; --font: "Schibsted Grotesk", system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--ground); color: var(--ink); font-family: var(--font); overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: .45; -webkit-mask-image: radial-gradient(ellipse 40% 60% at 74% 50%, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse 40% 60% at 74% 50%, #000 20%, transparent 70%); }
  .mark { position: absolute; left: 140px; top: 120px; display: flex; align-items: center; gap: 16px; font: 800 44px/1 var(--display); letter-spacing: -0.02em; color: var(--primary); }
  .mark svg { width: 50px; height: 50px; color: var(--signal); }
  h1 { position: absolute; left: 132px; top: 300px; width: 960px; margin: 0; font: 800 142px/0.98 var(--display); letter-spacing: -0.04em; color: var(--ink); }
  h1 .accent { color: var(--signal); display: block; }
  .line { position: absolute; left: 140px; top: 770px; margin: 0; font: 500 34px/1.3 var(--font); color: var(--ink-2); }
  .event { position: absolute; left: 140px; bottom: 96px; font: 600 20px/1 var(--mono); color: var(--primary); letter-spacing: .03em; }
  .phone { position: absolute; left: 1280px; top: 74px; width: 444px; height: 933px; border-radius: 58px; overflow: hidden; border: 12px solid #1B2433; outline: 1px solid var(--line-strong); box-shadow: 0 40px 90px rgba(0, 28, 100, .26); background: var(--ground); }
  .phone img { width: 100%; display: block; }
  .paid { position: absolute; left: 1090px; top: 800px; display: inline-grid; justify-items: center; gap: 4px; padding: 14px 26px 11px; font: 600 40px/1 var(--mono); letter-spacing: .1em; color: var(--paid-ink); background: var(--paid); border: 3px solid #C99A00; outline: 2px solid #C99A00; outline-offset: 5px; border-radius: 2px; transform: rotate(-4deg); box-shadow: 0 10px 28px rgba(61, 46, 0, .22); }
  .paid small { font: 500 16px/1 var(--mono); letter-spacing: .04em; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17"/><path d="m7.5 12.5 3 3 6-7"/></svg>VeriPay</div>
  <h1>The money waits <span class="accent">for the proof.</span></h1>
  <p class="line">PayPal holds it. AI checks the work. The pro gets paid.</p>
  <footer class="event">PayPal AI Hackathon 2026</footer>
  <!-- the pro's phone at "Paid $208.84 to your PayPal." (DP-1002, sandbox run; capture/v3/p11-cover.mjs) -->
  <div class="phone" aria-hidden="true"><img src="shot-pro-thread.png" alt="" /></div>
  <div class="paid" aria-hidden="true">PAID<small>every condition passed</small></div>
  <script>
    // ?nostamp renders the film's first frame without the PAID stamp (the film lands it)
    if (new URLSearchParams(location.search).has("nostamp")) document.querySelector(".paid").style.display = "none";
  </script>
</body></html>
